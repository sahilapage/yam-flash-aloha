# YAM right arm, "roll the sponge ball and place it": 55 kinesthetic demos at 60 Hz (episode 2 dropped,
# 15/38/53 held out). Top camera has the FK hand mask (yam_mask.json, sha256 059f0c29...) burned in;
# rollout must apply the same mask. Training only: the robot block satisfies the task schema.
schema_version: 1
task:
  name: yam_sponge
control_freq: 60
data:
  directory: DATA_DIR
robot:
  type: arx
  arms:
    right:
      model: L5
      can_interface: can1
      command_timeout_s: 0.5
      max_feedback_age_s: 0.1
cameras:
  names: [top, right_wrist]
camera_settings: {}
collection:
  max_duration_seconds: 30
training:
  observations: [qpos]
  outputs: [action]
  state_dim: 7
  action_dim: 7
